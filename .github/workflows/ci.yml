name: CI

on:
  push:
    branches:
      - vshare
      - "copilot/**"
      - "fix/**"
  pull_request:
    branches:
      - vshare

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests, and desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared protocol
        run: pnpm build:protocol

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build desktop application
        run: pnpm build:desktop
